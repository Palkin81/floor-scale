# Весы на ESP32 DevKit (тот же код, другая плата).  HX711: DOUT=GPIO33, SCK=GPIO32.
# Логика общая: packages/common.yaml и packages/scale.yaml; здесь только плата и пины.
substitutions:
  board: esp32dev
  esp_variant: esp32
  hx_dout_pin: GPIO33
  hx_clk_pin: GPIO32

packages:
  common: !include packages/common.yaml
  scale: !include packages/scale.yaml

esphome:
  name: floor-scale
  friendly_name: scale

esp32:
  board: ${board}
  variant: ${esp_variant}
