# Весы на XIAO ESP32-C6 (основная плата весов).
# Логика общая: packages/common.yaml и packages/scale.yaml; здесь только плата и пины.
substitutions:
  board: seeed_xiao_esp32c6
  esp_variant: esp32c6
  hx_dout_pin: GPIO18     # D10
  hx_clk_pin: GPIO20     # D9

packages:
  common: !include packages/common.yaml
  scale: !include packages/scale.yaml

esphome:
  name: floor-scale
  friendly_name: scale

esp32:
  board: ${board}
  variant: ${esp_variant}
