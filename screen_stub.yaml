substitutions:
  ap_ip: "192.168.4.11"      # адрес собственной точки доступа

packages:
  common: !include packages/common.yaml

esphome:
  name: floor-screen
  friendly_name: screen

script:
  - id: device_setup
    then:
      - lambda: |-
          ui::peer_ap_ip = "192.168.4.10";
          ui::peer_host = "floor-scale.local";

esp32:
  board: esp32dev

sensor:
  - platform: wifi_signal
    name: signal
    update_interval: 30s
